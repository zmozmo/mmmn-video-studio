name: Windows 0.15.5 Local Important-Scene Artwork Matching Unit QA
on:
  workflow_dispatch:
  push:
    branches: [main, feature/0155-local-major-image-matching]
    paths:
      - 'web/local-major-artwork-match.mjs'
      - 'tests/local-major-artwork-match.test.mjs'
      - '.github/workflows/local-major-artwork-0155-qa.yml'
permissions:
  contents: read
jobs:
  local-image-labels-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: No surprise photo change, preserves locks, one-photo 90m and private art
        run: |
          set -euo pipefail
          node --check web/local-major-artwork-match.mjs
          node --test tests/local-major-artwork-match.test.mjs tests/major-scene.test.mjs tests/major-artwork-brief.test.mjs
