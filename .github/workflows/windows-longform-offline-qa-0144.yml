name: Independent Windows 0.14.4 Long-Form and Four Presets QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/windows_longform_stress_0144.py'
      - '.github/workflows/windows-longform-offline-qa-0144.yml'
permissions:
  contents: read
concurrency:
  group: mmmn-0144-longform
  cancel-in-progress: false
jobs:
  published-setup-longform:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      NO_PROXY: 127.0.0.1,localhost
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download and verify EXACT public unsigned Windows 0.14.4 EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force published | Out-Null
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/windows-binaries-0144/downloads"
          foreach ($name in @('MMMN-Video-Studio-Setup-0.14.4.exe','MMMN-Video-Studio-Setup-0.14.4.exe.sha256')) {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path 'published' $name) -ErrorAction Stop
          }
          $setup='published/MMMN-Video-Studio-Setup-0.14.4.exe'
          $expected='db57d26241c19c9a2629f959245fa0ecb74c86d5a9bbfe04df8031cfe5da6830'
          $manifest=(Get-Content "$setup.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or $actual -ne $manifest) {
            throw "Published binary SHA256 mismatch: $actual"
          }
          Write-Host "Original released executable digest verified: $actual"
      - name: Install exact published executable in disposable Windows profile
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'published/MMMN-Video-Studio-Setup-0.14.4.exe') -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw "Installed executable missing: $exe" }
          "MMMN_RELEASE_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installed FFmpeg smoke test failed" }
      - name: 15min WAV, backup/restore, 3-chapter merge and all four MP4 aspect ratios
        shell: pwsh
        run: |
          python .github/scripts/windows_longform_stress_0144.py
          if ($LASTEXITCODE -ne 0) { throw "Published Windows long-form QA failed" }
      - name: Uninstall published application from disposable Windows user profile
        shell: pwsh
        if: always()
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/Uninstall.exe'
          if (Test-Path $uninstaller -PathType Leaf) {
            $p=Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
          }
