name: Independently QA Released Windows 0.14.6 Direct Setup EXE
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish Verified Windows 0.14.6 Direct EXE"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  installed-public-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      NO_PROXY: 127.0.0.1,localhost
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download EXACT publicly released setup.exe (NOT source or internal build artifact)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force published | Out-Null
          # GitHub Releases API currently denies creation with a 403 integration policy;
          # the same tested EXE is accessible directly (NO ZIP) in the binary-only branch.
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/windows-binaries-0146/downloads"
          foreach ($name in @('MMMN-Video-Studio-Setup-0.14.6.exe',
                              'MMMN-Video-Studio-Setup-0.14.6.exe.sha256',
                              'RELEASE-EVIDENCE-VERIFIED.json')) {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path 'published' $name) -ErrorAction Stop
          }
          $evidence=Get-Content 'published/RELEASE-EVIDENCE-VERIFIED.json' -Raw | ConvertFrom-Json
          $setup='published/MMMN-Video-Studio-Setup-0.14.6.exe'
          $sha='published/MMMN-Video-Studio-Setup-0.14.6.exe.sha256'
          if (!(Test-Path $setup) -or !(Test-Path $sha)) { throw 'Released setup and checksum are required' }
          $expected=(Get-Content $sha -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or $actual -ne $evidence.sha256 -or $evidence.status -ne 'PASS' -or $evidence.windows_install_upgrade_render_uninstall -ne 'VERIFIED') {
            throw 'Public installer integrity mismatch: refusal to execute'
          }
          Write-Host "Direct public released installer checksum verified: $actual"
      - name: Install EXACT prior stable Windows 0.14.0 and create real local app data through its API
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force legacy | Out-Null
          gh release download 'v0.14.0' -R $env:GITHUB_REPOSITORY -D legacy -p 'MMMN-Video-Studio-Setup-0.14.0.exe*'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the actual previous stable Windows release' }
          $legacy='legacy/MMMN-Video-Studio-Setup-0.14.0.exe'
          $actual=(Get-FileHash $legacy -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'd1b1908cd078d140713f923c33ccb5c2d4c8abe2f4042cfef982a3aaa21c462f') {
            throw 'Previous stable Windows installer digest mismatch'
          }
          $p=Start-Process -FilePath (Resolve-Path $legacy) -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Previous stable installer failed: $($p.ExitCode)" }
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          if (!(Test-Path $exe)) { throw 'Previous Windows release did not install' }
          $testRoot=Join-Path $env:RUNNER_TEMP 'mmmn-legacy-0140-to-0146'
          "MMMN_UPGRADE_TEST_ROOT=$testRoot" >> $env:GITHUB_ENV
          $env:MMMN_UPGRADE_TEST_ROOT=$testRoot
          python .github/scripts/windows_upgrade_0140_to_0146.py before --exe "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Could not save real legacy manuscript, WAV, PNG and backup via previous installed app' }
      - name: Install published setup.exe silently into ephemeral Windows runner user profile
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path published/MMMN-Video-Studio-Setup-0.14.6.exe) -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit $($p.ExitCode)" }
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          if (!(Test-Path $exe)) { throw "Published release did not install executable: $exe" }
          "MMMN_RELEASE_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable failed real FFmpeg self-test' }
          python .github/scripts/windows_upgrade_0140_to_0146.py after --exe "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'REAL 0.14.0 to 0.14.6 upgrade changed original user data or backup bytes' }
      - name: Independent real installed UI, narration upload, save/reload, and backup QA
        shell: pwsh
        run: |
          python -m pip install playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install UI test dependency' }
          python .github/scripts/windows_published_release_acceptance_0146.py
          if ($LASTEXITCODE -ne 0) { throw 'Released installer GUI/media/backup independent QA failed' }
      - name: Uninstall package from disposable Windows QA runner
        if: always()
        shell: pwsh
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/Uninstall.exe'
          if (Test-Path $uninstaller) {
            $p=Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Uninstaller exit: $($p.ExitCode)" }
          }
