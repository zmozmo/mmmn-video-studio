name: Publish Verified MMMN Windows Setup EXE Direct Download
on:
  workflow_run:
    workflows: ["MMMN Windows Installer In-place Upgrade Laboratory"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  verified-windows-setup:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download ONLY the verified native Windows installer artifact from successful run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p direct-setup
          gh run download "$SOURCE_RUN" --repo "$REPOSITORY" \
            --name MMMN-WINDOWS-SETUP-0.14.0-UNSIGNED-VERIFIED --dir direct-setup
          test -s direct-setup/MMMN-Video-Studio-Setup-0.14.0.exe
          test -s direct-setup/MMMN-Video-Studio-Setup-0.14.0.exe.sha256
          test -s direct-setup/RELEASE-EVIDENCE-VERIFIED.json
          test -s direct-setup/WINDOWS-RELEASE-CANDIDATE.json
      - name: Independently confirm exact executable digest and gate evidence before upload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('direct-setup')
          installer=root/'MMMN-Video-Studio-Setup-0.14.0.exe'
          sha_file=root/'MMMN-Video-Studio-Setup-0.14.0.exe.sha256'
          actual=hashlib.file_digest(installer.open('rb'),'sha256').hexdigest()
          text=sha_file.read_text().strip().lower()
          expected=text.split()[0]
          if len(expected)!=64 or actual!=expected:
              raise SystemExit('Installer SHA-256 mismatch; refused to publish')
          candidate=json.loads((root/'WINDOWS-RELEASE-CANDIDATE.json').read_text())
          evidence=json.loads((root/'RELEASE-EVIDENCE-VERIFIED.json').read_text())
          if not isinstance(candidate,dict) or not isinstance(evidence,dict):
              raise SystemExit('Release verification metadata corrupt')
          if (candidate.get('status')!='PASS' or evidence.get('status')!='PASS'
              or candidate.get('version')!='0.14.0'
              or candidate.get('exact_tested_bytes_reused') is not True
              or candidate.get('sha256')!=actual
              or evidence.get('sha256')!=actual
              or evidence.get('windows_install_upgrade_render_uninstall')!='VERIFIED'):
              raise SystemExit('Cannot publish: release evidence does not independently match the verified native setup.exe')
          print('VERIFIED NATIVE WINDOWS SETUP',installer.stat().st_size,'bytes SHA256',actual)
          print('CANDIDATE',str(candidate)[:1500])
          print('EVIDENCE',str(evidence)[:1500])
          PY
      - name: Publish DIRECT unsigned setup.exe (no ZIP extraction required)
        shell: bash
        run: |
          set -euo pipefail
          cat > direct-setup/RELEASE-NOTES.md <<EOF
          # MMMN Video Studio Windows 0.14.0 — unsigned release candidate

          This is a Windows x64 installer. It does not require extracting a source ZIP, installing Node.js, or running command-line build tools.

          Built and verified by a **real GitHub-hosted Windows runner**. The source build, H.264 + AAC MP4 render, base installation, in-place upgrade, real Edge UI, uninstall, and project/media SHA-256 preservation gates all passed before this release was permitted.

          Original verified CI: https://github.com/$REPOSITORY/actions/runs/$SOURCE_RUN
          Tested source commit: $SOURCE_SHA

          **Important:** The installer is unsigned. Windows SmartScreen may display a publisher warning. Check the provided SHA-256 if needed. This is a release candidate, not an independent certification or real-user endurance test. Android is paused. No private novels, audio, or user images were published.
          EOF
          if gh release view v0.14.0-rc.1 --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing silent overwrite"
            exit 1
          fi
          gh release create v0.14.0-rc.1 \
            "direct-setup/MMMN-Video-Studio-Setup-0.14.0.exe#MMMN-Video-Studio-Setup-0.14.0.exe" \
            "direct-setup/MMMN-Video-Studio-Setup-0.14.0.exe.sha256#MMMN-Video-Studio-Setup-0.14.0.exe.sha256" \
            "direct-setup/RELEASE-EVIDENCE-VERIFIED.json#RELEASE-EVIDENCE-VERIFIED.json" \
            --repo "$REPOSITORY" --target "$SOURCE_SHA" \
            --title "MMMN Video Studio 0.14.0 — Windows Setup (Unsigned RC1)" \
            --notes-file direct-setup/RELEASE-NOTES.md --prerelease
          echo "Direct Windows installer published:"
          echo "https://github.com/$REPOSITORY/releases/download/v0.14.0-rc.1/MMMN-Video-Studio-Setup-0.14.0.exe"
