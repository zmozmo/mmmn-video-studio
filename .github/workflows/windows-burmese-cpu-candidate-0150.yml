name: Research — Burmese-Specific CPU ASR Candidate (Public Audio Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-burmese-cpu-candidate-0150.yml'
permissions:
  contents: read
jobs:
  single-public-example-cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      MMNN_RESEARCH_ONLY: '1'
      OMP_NUM_THREADS: '3'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download OPEN public Burmese ASR model, never user content
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet huggingface_hub hf_xet
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path=snapshot_download(
            repo_id="freococo/myanmar_asr",
            allow_patterns=[
              "model.safetensors","model.py","transcribe.py","config.json",
              "preprocessor_config.json","vocab.json","cmvn.json",
              "requirements.txt","example.mp3",
            ],
            local_dir=os.environ["RUNNER_TEMP"]+"/public-burmese-model")
          print("Public model snapshot downloaded:",path)
          PY
          echo "MMMN_CANDIDATE_MODEL_DIR=$RUNNER_TEMP/public-burmese-model" >> "$GITHUB_ENV"
      - name: Install isolated CPU-only model dependencies (NOT included in Windows app)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends ffmpeg
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet -r "$RUNNER_TEMP/public-burmese-model/requirements.txt"
      - name: Evaluate actual model on one public Burmese sample and report observed error
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/windows_burmese_cpu_candidate_eval_0150.py
