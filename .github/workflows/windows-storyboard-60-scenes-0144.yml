name: Windows 0.14.4 60 Distinct-Scene Full-HD Storyboard QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/windows_storyboard_60_scenes_0144.py'
      - '.github/workflows/windows-storyboard-60-scenes-0144.yml'
permissions:
  contents: read
concurrency:
  group: mmmn-0144-60-scene-${{ github.ref }}
  cancel-in-progress: false
jobs:
  published-60-scenes:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NO_PROXY: 127.0.0.1,localhost
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download and verify exact published Windows 0.14.4 setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force published | Out-Null
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/windows-binaries-0144/downloads"
          foreach ($name in @('MMMN-Video-Studio-Setup-0.14.4.exe','MMMN-Video-Studio-Setup-0.14.4.exe.sha256')) {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path 'published' $name) -ErrorAction Stop
          }
          $setup='published/MMMN-Video-Studio-Setup-0.14.4.exe'
          $expected='db57d26241c19c9a2629f959245fa0ecb74c86d5a9bbfe04df8031cfe5da6830'
          $manifest=(Get-Content "$setup.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or $actual -ne $manifest) { throw "Public EXE checksum differs from release" }
          Write-Host "Unchanged 0.14.4 public installer SHA verified: $actual"
      - name: Install same published EXE on disposable Windows runner
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'published/MMMN-Video-Studio-Setup-0.14.4.exe') -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows setup failed" }
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          if (!(Test-Path $exe)) { throw "Installed app missing" }
          "MMMN_RELEASE_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Bundled encoder unavailable" }
      - name: Encode 60 unique PNG scene shots and 59 cross-dissolves as one 15min 1080p MP4
        shell: pwsh
        run: |
          python .github/scripts/windows_storyboard_60_scenes_0144.py
          if ($LASTEXITCODE -ne 0) { throw "60 distinct-scene novel storyboard QA failed" }
      - name: Uninstall from disposable Windows acceptance machine
        if: always()
        shell: pwsh
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/Uninstall.exe'
          if (Test-Path $uninstaller -PathType Leaf) {
            $p=Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Uninstall failed" }
          }
