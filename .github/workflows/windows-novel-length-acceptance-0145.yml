name: Windows 0.14.5 Complete Novel 90m and 120m MP4 QA
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Independently QA Released Windows 0.14.5 Direct Setup EXE"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mmmn-novel-0145-${{ github.ref }}
  cancel-in-progress: false
jobs:
  full-novel-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) }}
    name: Full novel ${{ matrix.minutes }}min 1080p (${{ matrix.frames }} frames)
    runs-on: windows-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - minutes: 90
            frames: 162000
          - minutes: 120
            frames: 216000
    env:
      NO_PROXY: 127.0.0.1,localhost
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact previously released Windows setup EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force published | Out-Null
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/windows-binaries-0145/downloads"
          foreach ($name in @('MMMN-Video-Studio-Setup-0.14.5.exe','MMMN-Video-Studio-Setup-0.14.5.exe.sha256')) {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path 'published' $name) -ErrorAction Stop
          }
          $setup='published/MMMN-Video-Studio-Setup-0.14.5.exe'
          $expected='db57d26241c19c9a2629f959245fa0ecb74c86d5a9bbfe04df8031cfe5da6830'
          $manifest=(Get-Content "$setup.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected -or $actual -ne $manifest) { throw "Public EXE checksum mismatch" }
          Write-Host "Verified exact original published EXE SHA256: $actual"
      - name: Install original verified release in disposable Windows profile
        shell: pwsh
        run: |
          $p=Start-Process -FilePath (Resolve-Path 'published/MMMN-Video-Studio-Setup-0.14.5.exe') -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed with exit $($p.ExitCode)" }
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw "Windows application missing" }
          "MMMN_RELEASE_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Offline packaged encoder self-test failed" }
      - name: Encode ${{ matrix.minutes }}-minute real 1920x1080 novel MP4; verify every frame and backup restore
        shell: pwsh
        run: |
          python .github/scripts/windows_novel_length_acceptance_0145.py --minutes ${{ matrix.minutes }}
          if ($LASTEXITCODE -ne 0) { throw "Novel-length Windows acceptance failed" }
      - name: Uninstall safely after real Windows novel QA
        shell: pwsh
        if: always()
        run: |
          $uninstaller=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/Uninstall.exe'
          if (Test-Path $uninstaller -PathType Leaf) {
            $p=Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Windows uninstaller failed" }
          }
