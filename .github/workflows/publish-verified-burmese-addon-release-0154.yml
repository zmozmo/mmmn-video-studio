name: Publish Independently Verified Burmese CPU Offline Model Add-on 0.15.4
on:
  workflow_run:
    workflows: ["Independent Real Windows Studio plus Installed Burmese Model Pack E2E 0.15.4"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  only-after-real-windows-studio-and-model-pass:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: burmese-asr-addon-0.15.4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download only the real model pack from a completed SUCCESS native Windows CI
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh run list --workflow windows-burmese-offline-model-pack-0154.yml --branch main -R "$GITHUB_REPOSITORY" --limit 12 --json databaseId,conclusion --jq '.[] | select(.conclusion == "success") | .databaseId' | head -n 1)
          test -n "$id" || { echo 'No PASS model pack. Refusing to publish.'; exit 1; }
          mkdir -p verified
          gh run download "$id" -R "$GITHUB_REPOSITORY" --name VERIFIED-MMMN-REAL-BURMESE-OFFLINE-MODEL-ADDON-0154 --dir verified
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          folder=Path('verified')
          file=folder/'MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe'
          manifest=folder/(file.name+'.sha256')
          assert file.is_file() and manifest.is_file()
          digest=hashlib.file_digest(file.open('rb'),'sha256').hexdigest()
          assert digest==manifest.read_text().split()[0].lower()
          assert file.stat().st_size>100_000_000
          assert file.stat().st_size<2_000_000_000
          print('Native PASS pack, SHA256',digest,'bytes',file.stat().st_size)
          PY
      - name: Publish EXACT already-tested optional model pack EXE to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          file=verified/MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe
          manifest=verified/MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe.sha256
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p prior
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern 'MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe' --dir prior
            cmp "$file" prior/MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe
            echo 'Identical previous asset already published; leaving unchanged.'
          else
            gh release create "$TAG" "$file" "$manifest" verified/offline-asr-license-notice-0154.txt -R "$GITHUB_REPOSITORY" --target main --prerelease --title "MMMN Burmese Offline CPU Model Add-on 0.15.4" --notes "OPTIONAL unsigned current-user Windows model installer. Requires MMMN Video Studio 0.15.4. Model by freococo Apache-2.0. Real 108.24-sec public Burmese multi-segment inference PASS; native Windows one-click model install and independent installed Studio-to-model SRT pipeline QA PASS. No original manuscript or private audio uploaded. ASR time positions are segment approximations ONLY and require proofreading; not word-accurate long novel speech alignment. No paid API. Uninstall removes only add-on, not author files."
          fi
          echo "Verified free offline model EXE: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe"
