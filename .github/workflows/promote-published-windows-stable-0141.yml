name: Finalize Verified Windows 0.14.1 Direct Download
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/promote-published-windows-stable-0141.yml
  workflow_run:
    workflows: ["Independently QA Published Windows 0.14.1 Setup EXE"]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  publish-independent-windows-qa-receipt:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NATIVE_RUN: '42448702717'
      QA_RUN: '42449367102'
      EXPECTED_SHA: 'd9966b888f7e46fb0bdbcf16626e32e2de99f1cc134521b3e2300b59b04fd861'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reject unverified native installer or failed real release-to-release Windows acceptance
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$NATIVE_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$QA_RUN" -R "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          git fetch --depth=1 origin windows-binaries-0141
          git switch -c windows-binaries-0141 FETCH_HEAD
          test -s downloads/MMMN-Video-Studio-Setup-0.14.1.exe
          test -s downloads/MMMN-Video-Studio-Setup-0.14.1.exe.sha256
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path("downloads")
          exe=p/"MMMN-Video-Studio-Setup-0.14.1.exe"
          with exe.open("rb") as f: digest=hashlib.file_digest(f,"sha256").hexdigest()
          expected=os.environ["EXPECTED_SHA"]
          e=json.loads((p/"RELEASE-EVIDENCE-VERIFIED.json").read_text())
          assert digest==expected==(p/"MMMN-Video-Studio-Setup-0.14.1.exe.sha256").read_text().split()[0].lower()
          assert e["status"]=="PASS" and e["sha256"]==digest and e["windows_install_upgrade_render_uninstall"]=="VERIFIED"
          print("STABLE VERIFIED UNSIGNED WINDOWS DIRECT EXE",exe.stat().st_size,digest)
          PY
      - name: Mark direct Windows installer independently accepted without rebuilding its bytes
        shell: bash
        run: |
          set -euo pipefail
          cat > downloads/WINDOWS-0141-ACCEPTANCE-VERIFIED.txt <<EOF
          MMMN Video Studio 0.14.1 Windows x64 — independent acceptance PASS
          Source installer SHA256: $EXPECTED_SHA
          Installer size: 64821111 bytes
          Actual Windows x64 install→upgrade→H.264/AAC render→Edge UI→uninstall→data preservation:
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN
          Independent published direct binary Windows QA:
          https://github.com/$GITHUB_REPOSITORY/actions/runs/$QA_RUN
          Previous stable 0.14.0 installed first: PASS
          Upgrade 0.14.0→0.14.1 original project, photo, WAV and backup 7 SHA256: PASS
          Edited manuscript preserves existing storyboard + manual locks: PASS
          Full verified media backup + restore of real original WAV bytes: PASS
          Explorer buttons whitelisted, arbitrary path rejected: PASS
          Browser offline no external requests during core flow: PASS
          This is an UNSIGNED installer. SmartScreen may warn. The user’s own Windows 11 laptop remains untested.
          Android remains paused; no private user content is included.
          EOF
          sed -i 's/Not code signed. Independent published-binary Windows QA is required before user acceptance./Not code signed. Independent published-binary Windows QA PASSED. See downloads\/WINDOWS-0141-ACCEPTANCE-VERIFIED.txt./' README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md downloads/WINDOWS-0141-ACCEPTANCE-VERIFIED.txt
          git commit -m 'Certify exact Windows 0.14.1 EXE after real 0.14.0 upgrade and backup restore QA'
          git push origin HEAD:refs/heads/windows-binaries-0141
          echo "VERIFIED DOWNLOAD:"
          echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/windows-binaries-0141/downloads/MMMN-Video-Studio-Setup-0.14.1.exe"
