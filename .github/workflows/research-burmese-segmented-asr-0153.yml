name: Research 0.15.3 — Long Burmese Narration Segmenter (No Model Download)
on:
  workflow_dispatch:
  push:
    branches: [main, research/0153-offline-burmese-asr-chunking]
    paths:
      - 'scripts/burmese_asr_chunker_0153.py'
      - 'tests/test_burmese_asr_chunker_0153.py'
      - '.github/workflows/research-burmese-segmented-asr-0153.yml'
permissions:
  contents: read
jobs:
  privacy-and-chunk-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate no-download, 90-min no-gap and review-only SRT
        run: |
          set -euo pipefail
          python -m py_compile scripts/burmese_asr_chunker_0153.py
          python -m unittest discover -s tests -p test_burmese_asr_chunker_0153.py -v
