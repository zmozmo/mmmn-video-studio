name: Native Windows Real Burmese CPU Add-on Installer 0.15.4
on:
  workflow_dispatch:
  push:
    branches: [main, feature/0154-burmese-local-asr-addon]
    paths:
      - 'windows-installer/MMMN-Burmese-ASR-Addon-0154.nsi'
      - 'scripts/burmese_asr_chunker_0153.py'
      - 'offline-asr-license-notice-0154.txt'
      - '.github/workflows/windows-burmese-offline-model-pack-0154.yml'
permissions:
  contents: read
jobs:
  pack-real-public-model:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free Windows build tools and CPU model runtime
        shell: pwsh
        run: |
          choco install nsis ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS/FFmpeg installation failed' }
          python -m pip install --disable-pip-version-check torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw 'CPU torch installation failed' }
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0 huggingface_hub hf_xet safetensors numpy soundfile librosa backports.tarfile
          if ($LASTEXITCODE -ne 0) { throw 'Model packaging dependencies failed' }
      - name: Fetch model files under free Apache-2.0 license to temporary runner
        shell: pwsh
        run: |
          @'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import hashlib
          root=Path('public-model')
          snapshot_download(repo_id='freococo/myanmar_asr',local_dir=str(root),
            allow_patterns=['model.safetensors','model.py','transcribe.py',
              'config.json','cmvn.json','vocab.json','preprocessor_config.json',
              'requirements.txt','example.mp3'])
          required=('model.safetensors','model.py','transcribe.py','vocab.json',
                    'config.json','cmvn.json','preprocessor_config.json','example.mp3')
          for name in required:
              assert (root/name).is_file(),name
          assert (root/'model.safetensors').stat().st_size>80_000_000
          print('PUBLIC MODEL SHA256',hashlib.sha256((root/'model.safetensors').read_bytes()).hexdigest())
          '@ | Set-Content -Path verify_model_0154.py -Encoding utf8
          python verify_model_0154.py
          if ($LASTEXITCODE -ne 0) { throw 'Public model download verify failed' }
          python -m pip install --disable-pip-version-check -r public-model/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Model dependencies from manifest failed' }
          python -c "from backports import tarfile; import pkg_resources; print('PASS namespace and runtime hook',tarfile.__name__)"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller namespace-hook dependencies missing' }
      - name: Build Windows portable EXE with all local CPU inference dependencies
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name mmmn-burmese-asr --paths public-model --hidden-import transcribe --hidden-import model --hidden-import backports --hidden-import backports.tarfile --collect-submodules backports --collect-all torch --collect-all torchaudio --collect-all librosa --collect-all safetensors --collect-all soundfile --collect-all numpy scripts/burmese_asr_chunker_0153.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          $exe='dist/mmmn-burmese-asr/mmmn-burmese-asr.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw 'Packaged Burmese EXE missing' }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Offline Burmese EXE help invocation failed' }
      - name: REAL CPU model transcription inside packaged Windows EXE without network
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'dist/mmmn-burmese-asr/mmmn-burmese-asr.exe').Path
          $audio=(Resolve-Path 'public-model/example.mp3').Path
          $model=(Resolve-Path 'public-model').Path
          $ffmpeg=(Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe=(Get-Command ffprobe.exe -ErrorAction Stop).Source
          $original=(Get-FileHash $audio -Algorithm SHA256).Hash
          $env:HF_HUB_OFFLINE='1'
          $env:TRANSFORMERS_OFFLINE='1'
          $env:HTTPS_PROXY='http://127.0.0.1:9'
          $env:HTTP_PROXY='http://127.0.0.1:9'
          New-Item -ItemType Directory -Force qa | Out-Null
          & $exe --input $audio --model-dir $model --output qa/review-only.srt --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Burmese model failed on REAL public speech' }
          $actual=Get-Content qa/review-only.srt -Raw -Encoding utf8
          if (!$actual.Contains('-->') -or !$actual.Contains('စ')) { throw 'No Myanmar SRT result' }
          if ((Get-FileHash $audio -Algorithm SHA256).Hash -ne $original) { throw 'Source WAV/MP3 modified' }
          & $exe --input $audio --model-dir $model --output qa/review-only.srt --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE -eq 0) { throw 'Existing reviewed SRT was overwritten' }
          Write-Host 'PASS: native compiled CPU model transcribed public Burmese without network; overwrite refused'
          # PyInstaller correctly exits nonzero when an existing reviewed SRT is protected.
          # This is an EXPECTED negative test, not an Action failure.
          exit 0
      - name: Compile one-click local-only model installer, exact tested runtime files
        shell: pwsh
        run: |
          $nsis='C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { throw 'NSIS compiler not found' }
          & $nsis '/V3' windows-installer/MMMN-Burmese-ASR-Addon-0154.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS model pack build failed' }
          $installer=Get-Item 'MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe'
          if ($installer.Length -lt 100000000) { throw 'Suspiciously small offline model installer' }
          $sha=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($installer.Name)" | Set-Content -Path "$($installer.Name).sha256" -Encoding ascii
          Write-Host "PASS packaged offline CPU model installer $($installer.Length) bytes sha256 $sha"
      - name: Actually install and run the one-click model pack in a clean Windows user profile
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe').Path
          $process=Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $dir=Join-Path $env:LOCALAPPDATA 'MMMN-Video-Studio-Trial/addons/BurmeseASR'
          $exe=Join-Path $dir 'mmmn-burmese-asr.exe'
          $weights=Join-Path $dir 'model/model.safetensors'
          if (!(Test-Path $exe) -or !(Test-Path $weights)) { throw 'Installed pack EXE/model missing' }
          $audio=(Resolve-Path 'public-model/example.mp3').Path
          $ffmpeg=(Get-Command ffmpeg.exe -ErrorAction Stop).Source
          $ffprobe=(Get-Command ffprobe.exe -ErrorAction Stop).Source
          & $exe --input $audio --model-dir (Join-Path $dir 'model') --output qa/installed-review-only.srt --ffmpeg $ffmpeg --ffprobe $ffprobe
          if ($LASTEXITCODE -ne 0 -or !(Test-Path qa/installed-review-only.srt)) { throw 'One-click installed offline model inference failed' }
          Write-Host 'PASS: actual installed 0.15.4 add-on ran Burmese CPU model with no private data'
      - uses: actions/upload-artifact@v4
        with:
          name: VERIFIED-MMMN-REAL-BURMESE-OFFLINE-MODEL-ADDON-0154
          if-no-files-found: error
          retention-days: 7
          path: |
            MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe
            MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe.sha256
            offline-asr-license-notice-0154.txt
