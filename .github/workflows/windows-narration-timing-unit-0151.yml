name: Windows 0.15.1 Offline Narration Timeline Safety Unit QA
on:
  workflow_dispatch:
  push:
    branches: [main, feature/0151-narration-timing-audit]
    paths:
      - 'web/narration-timing-audit.mjs'
      - 'tests/narration-timing-audit.test.mjs'
      - '.github/workflows/windows-narration-timing-unit-0151.yml'
permissions:
  contents: read
jobs:
  timeline-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regression - avoid false timing claims on long Burmese narration
        run: |
          set -euo pipefail
          node --check web/narration-timing-audit.mjs
          node --test tests/narration-timing-audit.test.mjs tests/burmese-transcript-agreement.test.mjs tests/burmese-transcript-chronology.test.mjs tests/major-scene.test.mjs tests/major-artwork-brief.test.mjs
      - name: Full 0.14.1-to-0.15.1 source patch chain and app UI audit witness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,tempfile,shutil
          archive=Path('public-safe-windows-source.zip')
          expected='a4ffb06ec4903f8c5266f981dffbb71302df23fd7b0611c1bf8944b48fac51b3'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==expected
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(archive) as z:z.extractall(tmp)
              base=Path(tmp)/'MMMN-Video-Studio'
              for p in base.rglob('*'):
                  if p.is_file():
                      dest=Path.cwd()/p.relative_to(base)
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(p,dest)
          PY
          python .github/scripts/fix_windows_mime.py
          for suffix in 0141 0142 0143 0144 0145 0146 0147 0148 0149 0150 0151; do
            python ".github/scripts/upgrade_windows_$suffix.py"
          done
          python -m py_compile portable/studio_server.py
          node --check web/app.js
          node --check web/narration-timing-audit.mjs
          python - <<'PY'
          from pathlib import Path
          source=Path('web/app.js').read_text(encoding='utf-8')
          for witness in ("case 'audit-current-srt':",
              'timelineAudit=auditNarrationTiming(c.recordedSeconds,cues)',
              'timelineAudit.safeForDraft',
              'အသံ / SRT အချိန်ကွက်လပ်',
              'MMMN Windows Offline Studio • v0.15.1'):
              assert witness in source,witness
          assert source.count("case 'audit-current-srt':")==1
          print('PASS: full Windows 0.15.1 patch chain and real UI guards')
          PY
