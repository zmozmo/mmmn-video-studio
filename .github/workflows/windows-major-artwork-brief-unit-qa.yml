name: MMMN Important Scene Photo Brief — Offline QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/major-artwork-brief.mjs'
      - 'tests/major-artwork-brief.test.mjs'
      - '.github/workflows/windows-major-artwork-brief-unit-qa.yml'
permissions:
  contents: read
jobs:
  important-images-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax and important-scene-only photo-brief contracts
        run: |
          node --check web/major-artwork-brief.mjs
          node --test tests/major-artwork-brief.test.mjs tests/major-scene.test.mjs
