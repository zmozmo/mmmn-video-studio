name: Windows 0.14.6 Major-Only Scene Button Real Edge Click QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-major-button-click-0146.yml'
permissions:
  contents: read
jobs:
  click-and-save-real-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download exact published Windows installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force published | Out-Null
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/windows-binaries-0146/downloads"
          foreach ($f in @('MMMN-Video-Studio-Setup-0.14.6.exe','MMMN-Video-Studio-Setup-0.14.6.exe.sha256')) {
            Invoke-WebRequest -Uri "$base/$f" -OutFile (Join-Path 'published' $f) -ErrorAction Stop
          }
          $setup='published/MMMN-Video-Studio-Setup-0.14.6.exe'
          $expected='b94b7e9a9f7e5dd373b38216dc2dcc7fa392bb56fd42b981f4f38c2d4a05814f'
          $actual=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=(Get-Content "$setup.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          if ($actual -ne $expected -or $actual -ne $manifest) { throw "Published EXE mismatch" }
          Write-Host "Exact original 0.14.6 released bytes verified: $actual"
      - name: Install exact published EXE and prepare Edge test harness
        shell: pwsh
        run: |
          $setup=(Resolve-Path 'published/MMMN-Video-Studio-Setup-0.14.6.exe').Path
          $p=Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows installer failed" }
          $exe=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          if (!(Test-Path $exe -PathType Leaf)) { throw "Installed app not found" }
          "MMMN_RELEASE_INSTALLED_EXE=$exe" >> $env:GITHUB_ENV
          python -m pip install --disable-pip-version-check playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw "Edge QA dependency failed" }
      - name: Click actual Major Scene button; persist and reload unchanged media/timing
        shell: pwsh
        run: |
          python .github/scripts/windows_major_button_click_0146.py
          if ($LASTEXITCODE -ne 0) { throw "Real installed Edge major scene click test failed" }
      - name: Uninstall safely from disposable machine
        if: always()
        shell: pwsh
        run: |
          $uninstall=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/Uninstall.exe'
          if (Test-Path $uninstall) {
            $p=Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Uninstaller failed" }
          }
