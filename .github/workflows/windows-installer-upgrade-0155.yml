name: MMMN Windows 0.15.5 Fail-Closed Burmese ASR Installer Laboratory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer-upgrade-0155.yml'
      - '.github/scripts/upgrade_windows_0155.py'
      - 'tests/burmese-transcript-chronology.test.mjs'
      - 'web/narration-timing-audit.mjs'
      - 'tests/narration-timing-audit.test.mjs'
      - 'web/major-scene-timing-evidence.mjs'
      - 'tests/major-scene-timing-evidence.test.mjs'
      - 'tests/windows_burmese_addon_0155_test.py'
      - 'web/local-major-artwork-match.mjs'
      - 'tests/local-major-artwork-match.test.mjs'
      - '.github/scripts/upgrade_windows_0155.py'
      - 'tests/burmese-transcript-agreement.test.mjs'
      - 'web/burmese-transcript-agreement.mjs'
concurrency:
  group: mmmn-windows-installer-0155-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  NO_PROXY: '127.0.0.1,localhost'
jobs:
  windows-installer-upgrade:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify source SHA256 and extract audited Windows source to runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = (Resolve-Path 'public-safe-windows-source.zip').Path
          $expected = 'a4ffb06ec4903f8c5266f981dffbb71302df23fd7b0611c1bf8944b48fac51b3'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source ZIP checksum mismatch: $actual" }
          $stage = Join-Path $env:RUNNER_TEMP 'mmmn-source-extract'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $stage -Force
          $source = Join-Path $stage 'MMMN-Video-Studio'
          if (!(Test-Path (Join-Path $source 'portable\launcher.py'))) { throw 'Missing source entrypoint' }
          if (!(Test-Path (Join-Path $source 'windows-installer\MMMN-Video-Studio.nsi'))) { throw 'Missing NSIS installer definition' }
          # Merge extracted source files including .github/workflows without nesting.
          foreach ($file in (Get-ChildItem -LiteralPath $source -File -Recurse -Force)) {
            $relative = $file.FullName.Substring($source.Length + 1)
            $destination = Join-Path (Get-Location) $relative
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
          }
          Remove-Item -LiteralPath $archive -Force
          # Correct NSIS uninstall registry quoting in this audited source revision.
          # NSIS 3.13 otherwise compiles malformed uninstaller registry commands.
          $nsisFile = 'windows-installer/MMMN-Video-Studio.nsi'
          $nsisContent = Get-Content -LiteralPath $nsisFile -Raw -Encoding utf8
          $badQuote = '$"$INSTDIR\Uninstall.exe$"'
          $goodQuote = '"$INSTDIR\Uninstall.exe"'
          if (-not $nsisContent.Contains($badQuote)) { throw 'Unexpected NSIS registry quoting; release candidate blocked' }
          $nsisContent = $nsisContent.Replace($badQuote, $goodQuote)
          Set-Content -LiteralPath $nsisFile -Value $nsisContent -NoNewline -Encoding utf8
          # On the Windows runner verify the source is still privacy-safe.
          node scripts/audit-public-source.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source privacy audit failed after ZIP extraction' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fix Windows .mjs JavaScript module response MIME before all tests and packaging
        shell: pwsh
        run: |
          python .github/scripts/fix_windows_mime.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows offline UI JavaScript MIME compatibility patch failed' }
          # Upgrade Windows-only app functionality in the audited source.
          python .github/scripts/upgrade_windows_0141.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 functionality/source version upgrade failed' }
          # In-place compatibility: overlay the incremental 0.15.5 storage
          # guard on top of audited 0.14.1 features, then test actual source.
          python .github/scripts/upgrade_windows_0142.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.14.2 base source patch refused source' }
          python .github/scripts/upgrade_windows_0143.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.14.3 base source patch refused source' }
          # Preserve the already verified 0.14.4 atomic storage patch, then
          # add the 0.15.5 novel-length FFprobe timeout fix independently.
          python .github/scripts/upgrade_windows_0144.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.14.4 atomic storage baseline refused source' }
          python .github/scripts/upgrade_windows_0145.py
          if ($LASTEXITCODE -ne 0) { throw 'Retained Windows 0.14.5 long-novel frame verification patch refused source' }
          python .github/scripts/upgrade_windows_0146.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.14.6 conservative scene baseline refused source' }
          python .github/scripts/upgrade_windows_0147.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.14.7 audio-first baseline patch refused source' }
          python .github/scripts/upgrade_windows_0148.py
          if ($LASTEXITCODE -ne 0) { throw 'Retained 0.14.8 speech cancellation patch refused source' }
          python .github/scripts/upgrade_windows_0149.py
          if ($LASTEXITCODE -ne 0) { throw '0.14.9 manuscript baseline rejected source' }
          python .github/scripts/upgrade_windows_0150.py
          if ($LASTEXITCODE -ne 0) { throw '0.15.0 chronology patch refused source' }
          python .github/scripts/upgrade_windows_0151.py
          if ($LASTEXITCODE -ne 0) { throw 'Retained 0.15.1 source refused patch' }
          python .github/scripts/upgrade_windows_0152.py
          if ($LASTEXITCODE -ne 0) { throw 'Retained 0.15.2 source refused patch' }
          python .github/scripts/upgrade_windows_0154.py
          if ($LASTEXITCODE -ne 0) { throw 'Retained 0.15.4 model support refused source' }
          python .github/scripts/upgrade_windows_0155.py
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 local image review refused source' }
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 native Burmese addon patch refused source' }
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 read-only evidence UI patch refused source' }
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 narration timeline audit patch refused source' }
          node --check web/burmese-transcript-agreement.mjs
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 Burmese text overlap module syntax invalid' }
          node --test tests/burmese-transcript-agreement.test.mjs tests/burmese-transcript-chronology.test.mjs tests/narration-timing-audit.test.mjs
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 fail-closed ASR manuscript tests failed' }
          python -m unittest discover -s tests -p windows_speech_async_0148_test.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 9 speech cancellation regressions failed' }
          node --check web/major-artwork-brief.mjs
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 photo brief JS syntax failed' }
          node --test tests/major-artwork-brief.test.mjs
          if ($LASTEXITCODE -ne 0) { throw '0.15.5 12 image brief regressions failed' }
          node --check web/major-scene.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 major-scene module JavaScript syntax failed' }
          node --test tests/major-scene.test.mjs tests/local-major-artwork-match.test.mjs tests/major-scene-timing-evidence.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 17 major-scene safety regressions failed' }
          python -m unittest discover -s tests -p windows_atomic_save_0144_test.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.14.4 retained atomic storage regression failed' }
          python -m unittest discover -s tests -p windows_long_probe_0145_test.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.14.5 retained long-novel frame verification regression failed' }
          python -m unittest discover -s tests -p windows_streaming_capacity_test.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 concurrent-import safety regression failed' }
          python -m unittest discover -s tests -p windows_storage_capacity_test.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 low-disk import safety regression' }
          python -m py_compile portable/studio_server.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 source syntax error' }
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Windows 0.15.5 UI source syntax error' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Windows-only build prerequisites (not end-user dependencies)
        shell: pwsh
        run: |
          choco install nsis ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install NSIS/FFmpeg prerequisites' }
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install pinned PyInstaller' }
      - name: Reject private data or secrets in public source
        shell: pwsh
        run: |
          node scripts/audit-public-source.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Public source privacy audit failed' }
      - name: Check all source tests before attempting Windows packaging
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory build-lab | Out-Null
          # Explicit test inputs avoid Node 22 auto-running the UI bundle generator.
          $jsFiles = @(Get-ChildItem -Path tests -File -Filter '*.test.mjs' |
            Select-Object -ExpandProperty FullName)
          if ($jsFiles.Count -lt 1) { throw 'No JavaScript tests were extracted' }
          node --test @jsFiles
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript suite failed' }
          python scripts/run-python-tests.py --timeout 180 --report build-lab/python-tests.json
          if ($LASTEXITCODE -ne 0) { throw 'Python suite failed or timed out' }
      - name: Locate REAL FFmpeg binaries, encode a video and stage both binaries
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory portable/bin | Out-Null
          # Chocolatey packages are not guaranteed to use one fixed bin directory.
          # Resolve the two EXEs together; never mix different FFmpeg distributions.
          $candidates = @()
          $choco = 'C:\ProgramData\chocolatey\lib'
          # Prefer real binaries, never package Chocolatey launcher shims.
          if (Test-Path $choco) {
            $candidates += @(Get-ChildItem $choco -Recurse -File -Filter 'ffmpeg.exe' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName)
          }
          $command = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($command -and $command.Source -and ($command.Source -notlike '*\chocolatey\bin\*')) {
            $candidates += $command.Source
          }
          $pair = $null
          foreach ($path in ($candidates | Select-Object -Unique)) {
            $probe = Join-Path (Split-Path $path -Parent) 'ffprobe.exe'
            if ((Test-Path $path -PathType Leaf) -and (Test-Path $probe -PathType Leaf)) {
              $pair = @($path, $probe); break
            }
          }
          if (-not $pair) { throw 'Could not find a matching Windows ffmpeg.exe and ffprobe.exe pair' }
          Copy-Item $pair[0] portable/bin/ffmpeg.exe -Force
          Copy-Item $pair[1] portable/bin/ffprobe.exe -Force
          # Do not pipe native -version output directly into Select-Object -First 1:
          # PowerShell may close the pipe before ffmpeg exits, causing a false nonzero code.
          $ffmpegVersion = @(& .\portable\bin\ffmpeg.exe -hide_banner -version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Windows ffmpeg.exe could not run, exit $LASTEXITCODE" }
          $ffmpegVersion | Select-Object -First 1
          $ffprobeVersion = @(& .\portable\bin\ffprobe.exe -hide_banner -version 2>&1)
          if ($LASTEXITCODE -ne 0) { throw "Windows ffprobe.exe could not run, exit $LASTEXITCODE" }
          $ffprobeVersion | Select-Object -First 1
          $encoders = & .\portable\bin\ffmpeg.exe -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch 'libx264') { throw 'Cannot package FFmpeg without required H.264 encoder' }
          New-Item -Force -ItemType Directory build-lab | Out-Null
          # Exercise the *actual* export contract, including audio. A video-only
          # FFmpeg smoke can pass even when the required AAC encoder is missing.
          & .\portable\bin\ffmpeg.exe -v error -y -f lavfi -i 'color=c=black:s=128x72:r=15' `
            -f lavfi -i 'sine=frequency=440:sample_rate=44100' -t 1 `
            -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 96k -shortest build-lab/ffmpeg-smoke.mp4
          if ($LASTEXITCODE -ne 0 -or !(Test-Path build-lab/ffmpeg-smoke.mp4)) { throw 'Bundled FFmpeg cannot encode H.264 + AAC MP4' }
          $codecs = @(& .\portable\bin\ffprobe.exe -v error -show_entries stream=codec_name `
            -of 'default=noprint_wrappers=1:nokey=1' build-lab/ffmpeg-smoke.mp4)
          if ($LASTEXITCODE -ne 0 -or @($codecs | Where-Object { $_ -eq 'h264' }).Count -ne 1 -or `
              @($codecs | Where-Object { $_ -eq 'aac' }).Count -ne 1) {
            throw "Bundled FFmpeg MP4 missing H.264 or AAC stream: $($codecs -join ', ')"
          }
          $sha = (Get-FileHash build-lab/ffmpeg-smoke.mp4 -Algorithm SHA256).Hash
          "Media contract PASS H264/AAC; sha256=$sha" | Set-Content build-lab/FFMPEG-VERIFIED.txt
      - name: Build first release EXE, compile first NSIS setup
        shell: pwsh
        run: |
          Set-Content -Path TRIAL-REVISION.txt -Value 'installer-lab-0155-base' -NoNewline
          python -m PyInstaller --noconfirm --clean --onedir --console --name MMMN-Video-Studio `
            --distpath dist-base --workpath build-base `
            --add-data 'web;web' --add-data 'renderer;renderer' `
            --add-data 'TRIAL-REVISION.txt;.' --add-data 'portable/bin;portable/bin' portable/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'First executable build failed' }
          & (Resolve-Path 'dist-base/MMMN-Video-Studio/MMMN-Video-Studio.exe').Path --self-test | Tee-Object -FilePath 'base-binary-self-test.json'
          if ($LASTEXITCODE -ne 0) { throw 'BASE Windows EXE packaged resources/FFmpeg self-test failed' }
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { throw 'NSIS compiler not found' }
          $payload = (Resolve-Path 'dist-base/MMMN-Video-Studio').Path
          & $nsis '/V3' '/DAPP_VERSION=0.15.5-lab-a' "/DAPP_PAYLOAD=$payload" windows-installer/MMMN-Video-Studio.nsi
          if ($LASTEXITCODE -ne 0) { throw 'First NSIS compile failed' }
          New-Item -Force -ItemType Directory build-lab | Out-Null
          Move-Item windows-installer/MMMN-Video-Studio-Setup-0.15.5-lab-a.exe build-lab/Setup-A.exe
      - name: Actually install A, start installed EXE, write test project and media
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'mmmn-upgrade-lab-project'
          Add-Content $env:GITHUB_ENV "MMMN_LAB_DATA=$data"
          $installer = (Resolve-Path build-lab/Setup-A.exe).Path
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Base installer failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MMMN Video Studio\MMMN-Video-Studio.exe'
          if (!(Test-Path $exe)) { throw 'Base install did not create app executable' }
          & $exe --self-test | Tee-Object -FilePath 'installed-base-self-test.json'
          if ($LASTEXITCODE -ne 0) { throw 'Installed base EXE fails real media self-test' }
          python tests/windows_installer_probe.py before --exe "$exe" --data-dir "$data"
          if ($LASTEXITCODE -ne 0) { throw 'Installed base executable cannot save project/media' }
      - name: Compile second release and update IN PLACE without uninstall
        shell: pwsh
        run: |
          Set-Content -Path TRIAL-REVISION.txt -Value 'installer-lab-0155-upgrade' -NoNewline
          python -m PyInstaller --noconfirm --clean --onedir --console --name MMMN-Video-Studio `
            --distpath dist-upgrade --workpath build-upgrade `
            --add-data 'web;web' --add-data 'renderer;renderer' `
            --add-data 'TRIAL-REVISION.txt;.' --add-data 'portable/bin;portable/bin' portable/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded executable build failed' }
          & (Resolve-Path 'dist-upgrade/MMMN-Video-Studio/MMMN-Video-Studio.exe').Path --self-test | Tee-Object -FilePath 'upgrade-binary-self-test.json'
          if ($LASTEXITCODE -ne 0) { throw 'UPGRADE Windows EXE packaged resources/FFmpeg self-test failed' }
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $payload = (Resolve-Path 'dist-upgrade/MMMN-Video-Studio').Path
          & $nsis '/V3' '/DAPP_VERSION=0.15.5' "/DAPP_PAYLOAD=$payload" windows-installer/MMMN-Video-Studio.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade NSIS compile failed' }
          Move-Item windows-installer/MMMN-Video-Studio-Setup-0.15.5.exe build-lab/Setup-B.exe
          $p = Start-Process -FilePath (Resolve-Path build-lab/Setup-B.exe).Path -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "In-place upgrade installer failed: $($p.ExitCode)" }
          $display = (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MMMNVideoStudio').DisplayVersion
          if ($display -ne '0.15.5') { throw "Installer registry did not update: $display" }
      - name: PROVE recovery, unchanged project/media hashes and packaged MP4 after upgrade
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\MMMN Video Studio\MMMN-Video-Studio.exe'
          & $exe --self-test | Tee-Object -FilePath 'installed-upgrade-self-test.json'
          if ($LASTEXITCODE -ne 0) { throw 'Installed upgraded EXE fails actual renderer/media self-test' }
          python tests/windows_installer_probe.py after --exe "$exe" --data-dir "$env:MMMN_LAB_DATA"
          if ($LASTEXITCODE -ne 0) { throw 'IN-PLACE UPGRADE FAILED safety verification' }
          # This is the ACTUAL installed, upgraded binary, not a source preview.
          python tests/windows_portable_exe_smoke.py --exe "$exe" |
            Tee-Object -FilePath 'installed-upgrade-e2e.json'
          if ($LASTEXITCODE -ne 0) { throw 'Upgraded Windows EXE failed full offline end-to-end test' }
          # Check the real UI with Playwright/installed Edge, not a Chromium
          # virtual-time DOM snapshot that can race pending native API requests.
          python -m pip install playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install Windows browser verification dependency' }
          Copy-Item "$env:GITHUB_WORKSPACE/.github/scripts/windows_edge_real_ui.py" tests/windows_edge_ui_smoke.py -Force
          python tests/windows_edge_ui_smoke.py --exe "$exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed upgraded EXE GUI failed browser smoke test' }
          $setupHash = (Get-FileHash build-lab/Setup-B.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  Setup-B.exe" | Set-Content -Encoding ascii build-lab/Setup-B.exe.sha256
          "INSTALLER UPGRADE LAB PASS: A installed, B overwrote without uninstall; project/media hashes and H264/AAC verified. Setup-B.exe SHA256=$setupHash" |
            Set-Content -Encoding utf8 build-lab/VERIFIED-IN-PLACE-UPGRADE.txt
      - name: Uninstall upgraded app and prove every synthetic project/media byte survives
        shell: pwsh
        run: |
          # This runs on a disposable GitHub-hosted Windows runner only.
          # The data location was created by the earlier installer probe.
          $dataRoot = Join-Path $env:MMMN_LAB_DATA 'MMMN-Video-Studio-Trial'
          $project = Join-Path $dataRoot 'project-state.json'
          $photo = Join-Path $dataRoot 'media\upgrade-test-photo.png'
          $video = Join-Path $dataRoot 'media\upgrade-test-video.mp4'
          $paths = @($project, $photo, $video)
          $before = @{}
          foreach ($path in $paths) {
            if (!(Test-Path $path -PathType Leaf)) { throw "Uninstall precheck: missing project/media: $path" }
            $before[$path] = (Get-FileHash $path -Algorithm SHA256).Hash
          }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\MMMN Video Studio'
          $uninstall = Join-Path $installDir 'Uninstall.exe'
          if (!(Test-Path $uninstall -PathType Leaf)) { throw 'Installed uninstaller not found' }
          $p = Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NSIS uninstaller failed with exit $($p.ExitCode)" }
          foreach ($path in $paths) {
            if (!(Test-Path $path -PathType Leaf)) { throw "UNINSTALL DELETED USER DATA: $path" }
            $after = (Get-FileHash $path -Algorithm SHA256).Hash
            if ($after -ne $before[$path]) { throw "UNINSTALL ALTERED USER DATA: $path" }
          }
          if (Test-Path (Join-Path $installDir 'MMMN-Video-Studio.exe')) {
            throw 'Uninstaller left the installed executable behind'
          }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MMMNVideoStudio') {
            throw 'Uninstall registry entry still exists'
          }
          'UNINSTALL DATA PRESERVATION PASS: original project, photo, and video SHA256 unchanged; EXE and registry removed.' |
            Set-Content -Encoding utf8 build-lab/VERIFIED-UNINSTALL-DATA-PRESERVED.txt
      - name: Independently verify installation, upgrade, render and uninstall evidence
        shell: pwsh
        run: |
          $expected = @(
            'installed-base-self-test.json',
            'installed-upgrade-self-test.json',
            'installed-upgrade-e2e.json',
            'build-lab/python-tests.json',
            'build-lab/FFMPEG-VERIFIED.txt',
            'build-lab/Setup-B.exe',
            'build-lab/Setup-B.exe.sha256',
            'build-lab/VERIFIED-IN-PLACE-UPGRADE.txt',
            'build-lab/VERIFIED-UNINSTALL-DATA-PRESERVED.txt'
          )
          foreach ($file in $expected) {
            $target = Join-Path build-lab (Split-Path $file -Leaf)
            if (!(Test-Path $file)) { throw "Missing evidence: $file" }
            if ($file -notlike 'build-lab/*') { Copy-Item $file $target -Force }
          }
          python scripts/verify_windows_release_evidence.py --folder build-lab --report build-lab/RELEASE-EVIDENCE-VERIFIED.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent evidence verifier failed. No installer may be published.' }
      - name: Promote the exact tested installer bytes to an unsigned Windows release candidate
        shell: pwsh
        run: |
          # This is the SAME setup B that was installed, upgraded, rendered,
          # uninstalled and independently verified; never rebuild after QA.
          python scripts/promote_windows_release_candidate.py --folder build-lab --version 0.15.5
          if ($LASTEXITCODE -ne 0) { throw 'Release promotion failed; unsigned installer will NOT be published' }
          $candidate = 'build-lab/MMMN-Video-Studio-Setup-0.15.5.exe'
          $original = 'build-lab/Setup-B.exe'
          if (!(Test-Path $candidate -PathType Leaf)) { throw 'Candidate setup.exe missing after promotion' }
          if ((Get-FileHash $candidate -Algorithm SHA256).Hash -ne (Get-FileHash $original -Algorithm SHA256).Hash) {
            throw 'Candidate setup.exe does not match the exact installer tested on Windows'
          }
      - name: Upload the exact tested Windows setup.exe only after ALL gates pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMMN-WINDOWS-SETUP-0.15.5-UNSIGNED-VERIFIED
          if-no-files-found: error
          retention-days: 30
          path: |
            build-lab/MMMN-Video-Studio-Setup-0.15.5.exe
            build-lab/MMMN-Video-Studio-Setup-0.15.5.exe.sha256
            build-lab/RELEASE-EVIDENCE-VERIFIED.json
            build-lab/WINDOWS-RELEASE-CANDIDATE.json
            build-lab/VERIFIED-IN-PLACE-UPGRADE.txt
            build-lab/VERIFIED-UNINSTALL-DATA-PRESERVED.txt
      - name: Save diagnostics when Windows installer laboratory fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MMMN-WINDOWS-LAB-FAILURE-DIAGNOSTICS
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-lab/**/*.json
            build-lab/**/*.txt
            build-lab/**/*.sha256
            *self-test.json
            *e2e.json
            build-lab/FFMPEG-VERIFIED.txt
      - name: Upload independently verified Windows release evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MMMN-WINDOWS-RELEASE-EVIDENCE
          if-no-files-found: error
          retention-days: 30
          path: |
            build-lab/RELEASE-EVIDENCE-VERIFIED.json
            build-lab/Setup-B.exe.sha256
