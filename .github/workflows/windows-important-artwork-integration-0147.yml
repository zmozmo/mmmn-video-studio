name: Windows 0.14.7 Important-Artwork and Audio-First Source Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/upgrade_windows_0147.py'
      - 'web/major-artwork-brief.mjs'
      - 'tests/major-artwork-brief.test.mjs'
      - '.github/workflows/windows-major-scene-integration-0147.yml'
      - 'web/major-scene.mjs'
      - 'tests/major-scene.test.mjs'
permissions:
  contents: read
jobs:
  source-and-real-ui-module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned synthetic-safe baseline and apply ALL six Windows patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, tempfile, shutil
          archive=Path("public-safe-windows-source.zip")
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest=="a4ffb06ec4903f8c5266f981dffbb71302df23fd7b0611c1bf8944b48fac51b3",digest
          with tempfile.TemporaryDirectory(prefix="mmmn-0147-baseline-") as tmp:
              with zipfile.ZipFile(archive) as z:z.extractall(tmp)
              root=Path(tmp)/"MMMN-Video-Studio"
              assert (root/"portable/studio_server.py").exists()
              for p in root.rglob("*"):
                  if p.is_file():
                      dest=Path.cwd()/p.relative_to(root)
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(p,dest)
          PY
          python .github/scripts/fix_windows_mime.py
          python .github/scripts/upgrade_windows_0141.py
          python .github/scripts/upgrade_windows_0142.py
          python .github/scripts/upgrade_windows_0143.py
          python .github/scripts/upgrade_windows_0144.py
          python .github/scripts/upgrade_windows_0145.py
          python .github/scripts/upgrade_windows_0146.py
          python .github/scripts/upgrade_windows_0147.py
          python -m py_compile portable/studio_server.py
          node --check web/app.js
          node --check web/major-scene.mjs
          node --check web/major-artwork-brief.mjs
          node --test tests/major-artwork-brief.test.mjs
          node --test tests/major-scene.test.mjs
          python -m unittest discover -s tests -p windows_atomic_save_0144_test.py -v
          python -m unittest discover -s tests -p windows_long_probe_0145_test.py -v
      - name: Prove installed UI patch really has one Major-only button flow
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("web/app.js").read_text(encoding="utf-8")
          assert s.count("case 'major-only-scene-plan'")==1
          assert s.count("case 'audio-first-major-plan'")==1
          assert s.count("case 'export-major-picture-brief'")==1
          assert "consolidateMajorScenes(draft.scenes" in s
          assert "alignmentSummary='Major-only draft:" in s
          assert "buildMajorArtworkBrief(c,project.assets" in s
          assert "transcribe_narration" in s
          assert "MMMN Windows Offline Studio • v0.14.7" in s
          print("PASS: Windows 0.14.7 patched UI and conservative major-scene, photo brief and optional audio-first event flow")
          PY
