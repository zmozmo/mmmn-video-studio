name: Build and REAL Windows QA Single-EXE MMMN Studio Complete 0.15.5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-installer/MMMN-Video-Studio-Complete-0155.nsi'
      - '.github/workflows/windows-complete-one-click-0155.yml'
permissions:
  contents: read
  actions: read
jobs:
  exact-two-verified-offline-exes:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      NO_PROXY: 127.0.0.1,localhost
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install free NSIS installer builder on disposable Windows runner
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Download EXACT public QA-verified Studio 0.15.5 setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payloads | Out-Null
          $base="https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/windows-binaries-0155/downloads"
          foreach($name in @('MMMN-Video-Studio-Setup-0.15.5.exe','MMMN-Video-Studio-Setup-0.15.5.exe.sha256')) {
            Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path payloads $name) -ErrorAction Stop
          }
          $exe='payloads/MMMN-Video-Studio-Setup-0.15.5.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=(Get-Content "$exe.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          if ($manifest -ne $sha -or $sha -ne '82a46db961713db2a38fdd9bad998cd351e7a87f9bb548329161a2885816f63a') {
            throw 'Studio installer differs from exact independent Windows QA'
          }
      - name: Download EXACT released real Burmese CPU Model 0.15.4
        shell: pwsh
        run: |
          gh release download burmese-asr-addon-0.15.4 -R $env:GITHUB_REPOSITORY --pattern 'MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe*' --dir payloads
          if ($LASTEXITCODE -ne 0) { throw 'Independently verified Burmese Model release unavailable' }
          $exe='payloads/MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=(Get-Content "$exe.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          if ($manifest -ne $sha -or $sha -ne 'af81e68f3971d6374bffa0987f547e716606e6cf46a45c72b9cf6274729dadeb') {
            throw 'Burmese CPU Model pack differs from independently installed QA'
          }
          Write-Host "PASS: two pinned real public Windows source installers. No rebuild and no cloud runtime."
      - name: Compile a single current-user one-click NSIS EXE containing both verified sources
        shell: pwsh
        run: |
          $nsis='C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) { throw 'NSIS compiler unavailable' }
          & $nsis /V3 windows-installer/MMMN-Video-Studio-Complete-0155.nsi
          if ($LASTEXITCODE -ne 0) { throw 'One-click Studio+Model compilation failed' }
          $exe='MMMN-Video-Studio-Complete-0.15.5.exe'
          if (!(Test-Path $exe)) { throw 'Final one-click EXE missing' }
          $size=(Get-Item $exe).Length
          if ($size -lt 400000000 -or $size -gt 1500000000) { throw "Unexpected one-click size $size" }
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $exe" | Set-Content -Path "$exe.sha256" -Encoding ascii
          Write-Host "One-click installer $size bytes SHA256 $sha"
      - name: Actually install ONE compiled EXE, validate BOTH installed components
        shell: pwsh
        run: |
          $exe=(Resolve-Path 'MMMN-Video-Studio-Complete-0.15.5.exe').Path
          $p=Start-Process -FilePath $exe -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'One-click complete setup failed' }
          $app=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          $addon=Join-Path $env:LOCALAPPDATA 'MMMN-Video-Studio-Trial/addons/BurmeseASR/mmmn-burmese-asr.exe'
          $weights=Join-Path $env:LOCALAPPDATA 'MMMN-Video-Studio-Trial/addons/BurmeseASR/model/model.safetensors'
          if (!(Test-Path $app) -or !(Test-Path $addon) -or !(Test-Path $weights)) { throw 'Complete installer did not install both components' }
          if ((Get-FileHash $weights -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd4d6b5b69c804db6043f3fc322c4e53f1996b274a55a0f7b260d15db812c541a') { throw 'Bundled Burmese model weights incorrect' }
          "MMMN_RELEASE_INSTALLED_EXE=$app" >> $env:GITHUB_ENV
          & $app --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Actual one-click installed Studio FFmpeg failed' }
          Write-Host 'PASS: ONE EXE installed actual Studio, CPU model, offline FFmpeg and matching audited weights'
      - name: REAL local Burmese voice via installed app and model; original data unaffected
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://huggingface.co/freococo/myanmar_asr/resolve/main/example.mp3' -OutFile synthetic-public-burmese.mp3 -ErrorAction Stop
          $env:MMMN_REAL_BURMESE_PUBLIC_AUDIO=(Resolve-Path synthetic-public-burmese.mp3).Path
          "MMMN_REAL_BURMESE_PUBLIC_AUDIO=$env:MMMN_REAL_BURMESE_PUBLIC_AUDIO" >> $env:GITHUB_ENV
          python .github/scripts/windows_burmese_published_addon_e2e_0154.py
          if ($LASTEXITCODE -ne 0) { throw 'ONE setup.exe did not deliver a working private speech-to-SRT pipeline' }
          Write-Host 'PASS: ONE installer => actual local CPU model ASR in installed Studio, source audio/locks intact'
      - name: Build verified installer QA evidence + exact signed-by-hash source lineage
        shell: pwsh
        run: |
          $exe='MMMN-Video-Studio-Complete-0.15.5.exe'
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $report=[ordered]@{status='PASS';version='0.15.5';
            exact_installed_bytes_sha256=$sha;one_click_windows_setup=$true;
            both_source_setups_sha256_pinned=$true;
            real_native_burmese_asr_in_installed_app=$true;
            unpublished_user_data_used=$false;original_narration_unchanged=$true;
            automatic_scene_approval=$false;
            signed_windows_publisher=$false;
            candidate_only_until_independent_public_binary_qa=$true}
          $report|ConvertTo-Json|Set-Content -Path COMPLETE-QA-VERIFIED-0155.json -Encoding utf8
      - name: Uninstall only binaries, prove original user-content tree is not removed
        shell: pwsh
        if: always()
        run: |
          $addon=Join-Path $env:LOCALAPPDATA 'MMMN-Video-Studio-Trial/addons/BurmeseASR/Uninstall-MMMN-Burmese-ASR.exe'
          if (Test-Path $addon) { Start-Process -FilePath $addon -ArgumentList '/S' -Wait }
          $main=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/Uninstall.exe'
          if (Test-Path $main) { Start-Process -FilePath $main -ArgumentList '/S' -Wait }
      - name: Upload exact one-click candidate only after ALL Windows gates pass
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QA-PASS-WINDOWS-ONE-CLICK-COMPLETE-0.15.5
          retention-days: 14
          if-no-files-found: error
          path: |
            MMMN-Video-Studio-Complete-0.15.5.exe
            MMMN-Video-Studio-Complete-0.15.5.exe.sha256
            COMPLETE-QA-VERIFIED-0155.json
