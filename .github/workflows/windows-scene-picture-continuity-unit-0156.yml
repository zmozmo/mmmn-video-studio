name: Windows 0.15.6 Same-Image Major-Scene Continuity Unit QA
on:
  workflow_dispatch:
  push:
    branches: [main, feature/0156-offline-scene-photo-continuity]
    paths:
      - 'web/major-scene-picture-continuity.mjs'
      - 'tests/major-scene-picture-continuity.test.mjs'
      - '.github/workflows/windows-scene-picture-continuity-unit-0156.yml'
permissions:
  contents: read
jobs:
  verified-only-local-photo-holds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Narration/photo safety and conservative visual continuity regression tests
        run: |
          set -euo pipefail
          node --check web/major-scene-picture-continuity.mjs
          node --test tests/major-scene-picture-continuity.test.mjs tests/local-major-artwork-match.test.mjs tests/major-scene.test.mjs tests/major-scene-timing-evidence.test.mjs
