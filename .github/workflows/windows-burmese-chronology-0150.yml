name: Windows 0.15.0 Burmese SRT Chronology Unit QA
on:
  workflow_dispatch:
  push:
    branches: [main, feature/0150-srt-chronology-guard]
    paths:
      - 'web/burmese-transcript-agreement.mjs'
      - 'tests/burmese-transcript-agreement.test.mjs'
      - 'tests/burmese-transcript-chronology.test.mjs'
      - '.github/workflows/windows-burmese-chronology-0150.yml'
permissions:
  contents: read
jobs:
  deterministic-burmese-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check complete Burmese text + chronology + major-only storyboard suites
        run: |
          set -euo pipefail
          node --check web/burmese-transcript-agreement.mjs
          node --test tests/burmese-transcript-agreement.test.mjs tests/burmese-transcript-chronology.test.mjs tests/major-scene.test.mjs tests/major-artwork-brief.test.mjs
