name: Fast Windows Edge UI Source Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/scripts/windows_ui_fast_probe.py'
      - '.github/workflows/windows-ui-fast-probe.yml'
jobs:
  diagnose-native-browser:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lightweight Edge test framework
        run: python -m pip install playwright==1.56.0
      - name: Reproduce Windows UI using the EXACT checked-in public-safe source
        env:
          NO_PROXY: 127.0.0.1,localhost
        run: python .github/scripts/windows_ui_fast_probe.py
      - name: Save diagnostic screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MMMN-WINDOWS-FAST-EDGE-DIAGNOSTIC
          path: fast-ui-debug.png
          if-no-files-found: ignore
