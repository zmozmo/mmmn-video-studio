name: Research 0.15.2 — Burmese CPU ASR, Public FLEURS Test Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/independent_fleurs_asr_0152.py'
      - '.github/workflows/research-burmese-fleurs-asr-0152.yml'
permissions:
  contents: read
jobs:
  public-only-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only research dependencies; no end-user installation
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends ffmpeg
          python -m pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet huggingface_hub hf_xet 'datasets[audio]==3.6.0' soundfile numpy
      - name: Obtain public Apache 2.0 Burmese model weights and CLI only
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          path=os.environ['RUNNER_TEMP']+'/public-model'
          snapshot_download(repo_id='freococo/myanmar_asr',local_dir=path,
            allow_patterns=['model.safetensors','model.py','transcribe.py',
              'config.json','preprocessor_config.json','vocab.json',
              'cmvn.json','requirements.txt'])
          with open(os.environ['GITHUB_ENV'],'a') as f:
              print('MMMN_CANDIDATE_MODEL_DIR='+path,file=f)
          PY
          python -m pip install --quiet -r "$RUNNER_TEMP/public-model/requirements.txt"
      - name: Six independent-source public Burmese clips; calculate real CER
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/independent_fleurs_asr_0152.py
          python .github/scripts/independent_fleurs_asr_0152.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BURMESE-ASR-PUBLIC-FLEURS-0152
          if-no-files-found: warn
          retention-days: 14
          path: public-burmese-asr-0152.json
