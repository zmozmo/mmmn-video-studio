name: Fast NSIS Model Add-on Path Smoke (Synthetic Files Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows-installer/MMMN-Burmese-ASR-Addon-0154.nsi'
      - '.github/workflows/fast-nsis-burmese-addon-smoke.yml'
permissions:
  contents: read
jobs:
  synthetic-paths-no-public-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build NSIS with fake payload names (never publish)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          mkdir -p dist/mmmn-burmese-asr/_internal public-model
          printf 'TEST ONLY' > dist/mmmn-burmese-asr/mmmn-burmese-asr.exe
          printf 'TEST ONLY' > dist/mmmn-burmese-asr/_internal/dummy.dll
          for file in model.safetensors model.py transcribe.py vocab.json config.json cmvn.json preprocessor_config.json; do
            echo 'SYNTHETIC TEST ONLY' > "public-model/$file"
          done
          makensis -V3 windows-installer/MMMN-Burmese-ASR-Addon-0154.nsi
          test -s MMMN-Burmese-ASR-Offline-Addon-0.15.4.exe
          echo "PASS: correct relative installer paths for compiled CPU runtime and local model; intentionally fake payload, no user release"
