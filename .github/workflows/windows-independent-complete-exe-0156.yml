name: Independently QA Public One-Click Windows Studio Complete 0.15.6
on:
  workflow_run:
    workflows: ["Publish Verified Single-EXE MMMN Video Studio Complete 0.15.6"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-released-one-click-windows-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      NO_PROXY: 127.0.0.1,localhost
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Independently download the EXACT public 0.15.6 Complete EXE, SHA and source witness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force released | Out-Null
          gh release download mmmn-complete-0.15.6 -R $env:GITHUB_REPOSITORY --pattern 'MMMN-Video-Studio-Complete-0.15.6.exe*' --dir released
          if ($LASTEXITCODE -ne 0) { throw 'Public one-click Complete EXE or SHA is not available' }
          gh release download mmmn-complete-0.15.6 -R $env:GITHUB_REPOSITORY --pattern 'COMPLETE-QA-VERIFIED-0156.json' --dir released
          if ($LASTEXITCODE -ne 0) { throw 'Missing independent native QA lineage witness' }
          $file='released/MMMN-Video-Studio-Complete-0.15.6.exe'
          $sha=(Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest=(Get-Content "$file.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $witness=Get-Content released/COMPLETE-QA-VERIFIED-0156.json -Raw | ConvertFrom-Json
          if ($sha -ne $manifest -or $sha -ne $witness.exact_installed_bytes_sha256) { throw 'Public released Complete setup differs from native QA installed bytes' }
          if ($witness.status -ne 'PASS' -or !$witness.real_native_burmese_asr_in_installed_app) { throw 'Unverified Windows model or edited lineage' }
          if ((Get-Item $file).Length -lt 400000000) { throw 'Missing one of the bundled real components' }
          Write-Host "PASS: exact public one-click Studio/Model package sha256 $sha"
      - name: Install SINGLE public Windows Complete Setup.exe silently on disposable runner
        shell: pwsh
        run: |
          $file=(Resolve-Path 'released/MMMN-Video-Studio-Complete-0.15.6.exe').Path
          $p=Start-Process -FilePath $file -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Public one-click Complete EXE failed real Windows install' }
          $app=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/MMMN-Video-Studio.exe'
          $addon=Join-Path $env:LOCALAPPDATA 'MMMN-Video-Studio-Trial/addons/BurmeseASR/mmmn-burmese-asr.exe'
          $weights=Join-Path $env:LOCALAPPDATA 'MMMN-Video-Studio-Trial/addons/BurmeseASR/model/model.safetensors'
          if (!(Test-Path $app) -or !(Test-Path $addon) -or !(Test-Path $weights)) { throw 'One-click public setup did not install BOTH app and model' }
          "MMMN_RELEASE_INSTALLED_EXE=$app" >> $env:GITHUB_ENV
          & $app --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Released complete installer FFmpeg self-test failed' }
          $modelSha=(Get-FileHash $weights -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelSha -ne 'd4d6b5b69c804db6043f3fc322c4e53f1996b274a55a0f7b260d15db812c541a') {
            throw 'Model weights inside public one-click installer do not match the independently verified public model'
          }
      - name: Public Burmese voice in real installed Studio and real CPU model, NO author content
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://huggingface.co/freococo/myanmar_asr/resolve/main/example.mp3' -OutFile public-burmese-example.mp3 -ErrorAction Stop
          $env:MMMN_REAL_BURMESE_PUBLIC_AUDIO=(Resolve-Path public-burmese-example.mp3).Path
          if (!(Test-Path $env:MMMN_REAL_BURMESE_PUBLIC_AUDIO)) { throw 'Public Burmese sample unavailable locally' }
          "MMMN_REAL_BURMESE_PUBLIC_AUDIO=$env:MMMN_REAL_BURMESE_PUBLIC_AUDIO" >> $env:GITHUB_ENV
          python .github/scripts/windows_burmese_published_addon_e2e_0154.py
          if ($LASTEXITCODE -ne 0) { throw 'Public Complete EXE real Burmese local transcription or original media integrity failed' }
          Write-Host 'PASS: public one-click COMPLETE setup app+local model generated real review-only SRT with voice+project+manual image locks unchanged'
      - name: Safely uninstall only binaries from disposable Windows user profile
        shell: pwsh
        if: always()
        run: |
          $model=Join-Path $env:LOCALAPPDATA 'MMMN-Video-Studio-Trial/addons/BurmeseASR/Uninstall-MMMN-Burmese-ASR.exe'
          if (Test-Path $model) { Start-Process -FilePath $model -ArgumentList '/S' -Wait }
          $app=Join-Path $env:LOCALAPPDATA 'Programs/MMMN Video Studio/Uninstall.exe'
          if (Test-Path $app) { Start-Process -FilePath $app -ArgumentList '/S' -Wait }
          Write-Host 'Uninstallers executed for disposable QA, original user media remains outside binary trees'
